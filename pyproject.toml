[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-free-free"
version = "0.1.0"
description = "Dimensionless 3D flow preparation for free-free radio transfer"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
vtk = ["meshio>=5", "scipy>=1.8"]
visualization = ["matplotlib>=3.5"]

[project.scripts]
rff-flow = "radio_free_free.cli:main"
rff-occult = "radio_free_free.occulter:main"
rff-plot = "radio_free_free.plot:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
